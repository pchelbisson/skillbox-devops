global:
  scrape_interval: 5s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: 'app_server'
    static_configs:
      - targets: ['app-exporter:9100']

  - job_name: 'db_server'
    static_configs:
      - targets: ['db-exporter:9100']

  - job_name: 'monitoring_node'
    static_configs:
      - targets: ['localhost:9090']

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093