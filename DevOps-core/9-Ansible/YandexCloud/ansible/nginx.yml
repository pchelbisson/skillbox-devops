---
- hosts: nginx_servers
  become: yes
  vars:
    reactjs_host_ip: "192.168.10.3" 
    reactjs_host_port: "80"

  pre_tasks:
    - name: Remove default nginx symlink
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

  handlers:
    - name: reload nginx
      service:
        name: nginx
        state: reloaded

  tasks:
    - name: Create nginx config from template
      template:
        src: nginx.conf.j2
        dest: /etc/nginx/sites-enabled/nginx.conf
        owner: root
        mode: '0644'
      notify: reload nginx
